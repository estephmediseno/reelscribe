[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reelscribe"
version = "0.1.0"
description = "Batch TikTok and Instagram Reels transcription and local Ollama content analytics CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "yt-dlp>=2024.1.0",
]

[project.scripts]
reelscribe = "reelscribe.cli:main"

[tool.setuptools.packages.find]
include = ["reelscribe*"]
